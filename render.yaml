# VukaPay on Render. API and worker stay on the Starter plan.
# Payaza keys are dashboard-only. Do not put them in this file.
# After this lands on main, open the Blueprint in the Render dashboard and sync it.
# A git push alone does not change build settings on a site created by hand.
services:
  - type: web
    name: vukapay-api
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate --schema packages/db/prisma/schema.prisma
    preDeployCommand: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma
    startCommand: npm run start -w @vukapay/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vukapay-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: PAYAZA_TENANT
        value: test
      - key: PAYAZA_BASE_URL
        value: https://api.payaza.africa/live/
      - key: PAYAZA_PUBLIC_KEY
        sync: false
      - key: PAYAZA_SECRET_KEY
        sync: false
      - key: PAYAZA_TRANSACTION_PIN
        sync: false
      - key: PAYAZA_COLLECTION_CODES_JSON
        sync: false
      - key: PAYAZA_KES_MOMO_BANK_CODE
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_BASE_URL
        value: https://sandbox.safaricom.co.ke
      - key: FEE_BPS
        value: "150"
      - key: FX_SPREAD_BPS
        value: "150"
      - key: FX_SETTLEMENT_MODE
        value: treasury_float
      - key: FX_MAX_OPEN_EXPOSURE_KES_MINOR
        value: "500000000"
      - key: CREDIT_ENABLED
        value: "true"
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_SENDER_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false

  - type: worker
    name: vukapay-worker
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate --schema packages/db/prisma/schema.prisma
    startCommand: npm run start -w @vukapay/worker
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vukapay-db
          property: connectionString
      - key: APP_SECRET
        fromService:
          name: vukapay-api
          type: web
          envVarKey: APP_SECRET
      - key: PAYAZA_TENANT
        value: test
      - key: PAYAZA_PUBLIC_KEY
        fromService:
          name: vukapay-api
          type: web
          envVarKey: PAYAZA_PUBLIC_KEY
      - key: PAYAZA_SECRET_KEY
        fromService:
          name: vukapay-api
          type: web
          envVarKey: PAYAZA_SECRET_KEY
      - key: PAYAZA_TRANSACTION_PIN
        fromService:
          name: vukapay-api
          type: web
          envVarKey: PAYAZA_TRANSACTION_PIN
      - key: PAYAZA_BASE_URL
        value: https://api.payaza.africa/live/
      - key: PAYAZA_COLLECTION_CODES_JSON
        fromService:
          name: vukapay-api
          type: web
          envVarKey: PAYAZA_COLLECTION_CODES_JSON
      - key: PAYAZA_KES_MOMO_BANK_CODE
        fromService:
          name: vukapay-api
          type: web
          envVarKey: PAYAZA_KES_MOMO_BANK_CODE
      - key: FX_SETTLEMENT_MODE
        value: treasury_float
      - key: FX_MAX_OPEN_EXPOSURE_KES_MINOR
        value: "500000000"
      - key: CREDIT_ENABLED
        value: "true"
      - key: AT_USERNAME
        fromService:
          name: vukapay-api
          type: web
          envVarKey: AT_USERNAME
      - key: AT_API_KEY
        fromService:
          name: vukapay-api
          type: web
          envVarKey: AT_API_KEY
      - key: AT_SENDER_ID
        fromService:
          name: vukapay-api
          type: web
          envVarKey: AT_SENDER_ID
      - key: TWILIO_ACCOUNT_SID
        fromService:
          name: vukapay-api
          type: web
          envVarKey: TWILIO_ACCOUNT_SID
      - key: TWILIO_AUTH_TOKEN
        fromService:
          name: vukapay-api
          type: web
          envVarKey: TWILIO_AUTH_TOKEN
      - key: TWILIO_FROM
        fromService:
          name: vukapay-api
          type: web
          envVarKey: TWILIO_FROM

  # Dashboard service "Vuka-Pay" (https://vuka-pay-zci5.onrender.com).
  # The name must match that service or a Blueprint sync creates a second site.
  - type: web
    name: Vuka-Pay
    runtime: static
    repo: https://github.com/IanDev-cmd/Vuka-Pay
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: https://vukapay-api.onrender.com

databases:
  - name: vukapay-db
    databaseName: vukapay
    plan: basic-256mb
    postgresMajorVersion: "16"
